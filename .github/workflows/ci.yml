name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend lint & build ──────────────────────────────────────────────────
  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5000/api/v1

  # ── API unit tests ─────────────────────────────────────────────────────────
  api:
    name: API — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt flake8

      - name: Lint (flake8)
        run: flake8 app/ --max-line-length=120 --extend-ignore=E501

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///test.db
          INFERENCE_URL: http://localhost:8501
          JWT_SECRET: test-secret-key-at-least-32-bytes-long
          UPLOAD_DIR: /tmp/agroscan_thumbnails
          PYTHONPATH: .
        run: pytest tests/ -v --tb=short

  # ── Docker build check ─────────────────────────────────────────────────────
  docker-build:
    name: Docker — build all images
    runs-on: ubuntu-latest
    needs: [frontend, api]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          tags: agroscan-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Inference image
        uses: docker/build-push-action@v6
        with:
          context: ./inference
          push: false
          tags: agroscan-inference:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: agroscan-frontend:ci
          build-args: VITE_API_BASE_URL=http://localhost:5000/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── class_indices consistency check ───────────────────────────────────────
  model-sync:
    name: class_indices ↔ seed data consistency
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check class count matches seed
        run: |
          python - <<'EOF'
          import json, sys

          with open('inference/models/class_indices.json') as f:
              indices = json.load(f)

          # Count expected classes from seed.py (28 classes: 5+6+5+8+5 - 1 because class_id starts at 0)
          expected = 29   # 0-indexed 0..28
          actual = len(indices)
          if actual != expected:
              print(f"FAIL: class_indices.json has {actual} entries, expected {expected}")
              sys.exit(1)

          # Ensure every entry has required keys
          for idx, entry in indices.items():
              for key in ('crop', 'disease', 'is_healthy'):
                  if key not in entry:
                      print(f"FAIL: index {idx} missing key '{key}'")
                      sys.exit(1)

          print(f"OK: {actual} classes, all entries valid")
          EOF
