[supervisord]
nodaemon=true
user=root
loglevel=info
; Render Web Service container sends SIGTERM on shutdown — propagate it to both children
stopwaitsecs=30

; --------------------  gunicorn — Flask API backend -------------------------
[program:gunicorn]
directory=/app
; IMPORTANT — bind to 127.0.0.1:5000 ONLY (not 0.0.0.0). Nginx is the sole
; front-door on port 80; outside-world traffic can never reach gunicorn directly
; which eliminates a whole class of exposure concerns.
command=/usr/local/bin/gunicorn --bind 127.0.0.1:5000 --workers %(ENV_WEB_CONCURRENCY)s --timeout 180 wsgi:app
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=TERM

; --------------------  nginx — SPA static + reverse proxy to /api ------------
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=TERM
