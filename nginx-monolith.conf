###############################################################################
# nginx-monolith.conf — nginx front-door for the AgroScan NG MONOLITH build.
#
# One hostname, two apps:
#   - All requests under  /api/...   → reverse-proxy to gunicorn (Flask/backend)
#     listening on localhost:5000 (same container, not exposed publicly).
#   - Everything else /*           → serve Vite-built static SPA files from
#     /usr/share/nginx/html/, with a catch-all fallback to /index.html so
#     React BrowserRouter deep-links (e.g. /diagnose, /history) work on
#     direct browser navigation / refresh.
#
# Render Web Service exposes only one port (nginx:80). gunicorn:5000 is bound
# to 127.0.0.1 (localhost only); it is NOT reachable from outside the container.
###############################################################################

server {
    listen 80;
    server_name _;

    # Allow large-ish image uploads (farmers send phone photos which can be big)
    client_max_body_size 32M;

    # Real IP handling for Render's forwarded headers
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;

    ###########################################################################
    # /api/*  →  backend Flask app via gunicorn on localhost:5000
    ###########################################################################
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Upload / diagnose timeouts — AI inference is slow on cold start
        proxy_read_timeout 180s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;

        # Streaming responses + disable buffering for SSE if added later
        proxy_buffering off;
    }

    ###########################################################################
    # /healthz  →  proxy to backend /healthz (Render's health check, always
    #              resolves quickly; we use the backend one so it verifies
    #              both nginx AND gunicorn are alive).
    ###########################################################################
    location = /healthz {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ###########################################################################
    # Everything else  →  serve SPA static files; fallback to /index.html
    ###########################################################################
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Aggressive caching for Vite-generated hashed asset filenames
        # (chunk-HASH.js / HASH.svg fonts etc. are content-hashed — safe).
        location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|ico|svg|webp|avif|wasm)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri =404;
        }

        # index.html must NEVER be cached — React SPA boot entry point
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        }
    }

    # Friendly JSON 404 instead of nginx HTML page
    error_page 404 /nginx-404.json;
    location = /nginx-404.json {
        default_type application/json;
        return 404 '{"error":"not_found","service":"AgroScan NG Monolith","message":"route-not-found-use-api-or-frontend"}';
    }
}
