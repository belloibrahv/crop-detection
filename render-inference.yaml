services:
  # Inference Service (TensorFlow ML Model) - Requires paid plan for ML workloads
  - type: pserv
    name: agroscan-inference
    env: docker
    plan: starter
    region: oregon
    # Keep Render build context at repo root and use the exact repo-relative
    # path to the Dockerfile. This avoids "open Dockerfile: no such file or
    # directory" errors observed with dockerContext != ".".
    dockerfilePath: inference/Dockerfile
    dockerContext: .
    envVars:
      - key: MODEL_VERSION
        value: v1
    healthCheckPath: /healthz
