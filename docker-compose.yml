services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agroscan
      POSTGRES_USER: agroscan
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agroscan"]
      interval: 10s
      timeout: 5s
      retries: 5

  inference:
    build:
      context: ./inference
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MODEL_VERSION: ${MODEL_VERSION:-v1}
    volumes:
      - ./inference/models:/app/models:ro
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://agroscan:${DB_PASSWORD:-devpassword}@db:5432/agroscan
      INFERENCE_URL: http://inference:8501
      JWT_SECRET: ${JWT_SECRET:-devsecret}
      ALLOWED_ORIGINS: http://localhost:3000
      UPLOAD_DIR: /app/uploads/thumbnails
      UPLOAD_URL_PREFIX: /api/v1/uploads/thumbnails
    volumes:
      - thumbnails:/app/uploads/thumbnails
    depends_on:
      db:
        condition: service_healthy
      inference:
        condition: service_healthy
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # VITE_API_BASE_URL must be the URL the *browser* uses, not the internal
      # Docker network hostname — so always localhost:<host-port>.
      args:
        VITE_API_BASE_URL: http://localhost:5000/api/v1
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  thumbnails:
