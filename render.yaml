services:
  # PostgreSQL Database
  - type: pserv
    name: agroscan-db
    databaseName: agroscan
    user: agroscan
    plan: free
    region: oregon
    
  # Backend API Service
  - type: pserv
    name: agroscan-api
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agroscan-db
          property: connectionString
      - key: INFERENCE_URL
        value: https://agroscan-inference.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://agroscan-frontend.onrender.com
      - key: UPLOAD_DIR
        value: /app/uploads/thumbnails
      - key: UPLOAD_URL_PREFIX
        value: /api/v1/uploads/thumbnails
    healthCheckPath: /api/v1/healthz
    
  # Frontend (Static Site)
  - type: web
    name: agroscan-frontend
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    publishDirectory: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://agroscan-api.onrender.com/api/v1
